<style>
/* Layout: one quiet column; each fight = one header line, one deck line, one strip of screenshots. */
:root {
  --bg: #f3f5f8; --ink: #18222e; --muted: #6a7787; --line: #d8dee6;
  --glass: #2c7f93; --played: #1f7a4d; --held: #a2541a; --none: #6b7684;
  --display: "Kreon", Georgia, serif; --body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a23; --ink: #e3e9f0; --muted: #8796a8; --line: #26323f;
  --glass: #7fd0e0; --played: #6fd39f; --held: #f0a36a; --none: #9aa6b4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121a23; --ink: #e3e9f0; --muted: #8796a8; --line: #26323f;
  --glass: #7fd0e0; --played: #6fd39f; --held: #f0a36a; --none: #9aa6b4; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 36px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; margin-right: auto; }
h2 { font-size: 1.15rem; }
.muted { color: var(--muted); }
.hint { font-size: .85rem; color: var(--muted); }
.hint kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

.fight { display: grid; gap: 10px; scroll-margin-top: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.floor { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; }
.status { font-size: .82rem; font-weight: 600; }
.status.played { color: var(--played); } .status.held { color: var(--held); } .status.none { color: var(--none); }
.deck { font-size: .85rem; color: var(--muted); }
.deck .ac { color: var(--glass); font-weight: 600; }
.deck .add { color: var(--ink); font-weight: 600; }

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
figure { margin: 0; min-width: 0; display: grid; gap: 3px; }
figure button { all: unset; cursor: zoom-in; display: block; border-radius: 4px; overflow: hidden; }
figure button:focus-visible { outline: 3px solid var(--glass); outline-offset: 2px; }
figure img { display: block; width: 100%; aspect-ratio: 1854 / 1042; object-fit: cover; background: var(--line); }
figcaption { font-size: .78rem; color: var(--muted); }
figcaption.selected, figcaption.after { color: var(--played); }
figcaption.hand { color: var(--held); }

dialog { padding: 0; border: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; background: #07090d; overflow: hidden; }
dialog::backdrop { background: #07090d; }
.v-stage { position: absolute; inset: 0 0 44px; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top, 0px)) 56px 0; }
.v-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
.v-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 16px; align-items: center; color: #9fb0c2; font-size: .85rem; }
.v-cap { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-count { font-variant-numeric: tabular-nums; }
.v-nav { position: absolute; top: 0; bottom: 44px; width: 56px; border: 0; background: transparent; color: #fff; font-size: 2rem; cursor: pointer; opacity: .4; }
.v-nav:hover, .v-nav:focus-visible { opacity: 1; outline: none; }
.v-prev { left: 0; } .v-next { right: 0; }
@media (max-width: 640px) { .v-stage { padding-inline: 4px; } .v-nav { width: 40px; } }
</style>

const AC = "Speculative Execution";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ORDER = [AC, "Strike", "Defend", "Zap", "Dualcast", "Dualcast+"];
const rank = n => { const i = ORDER.indexOf(n.startsWith(AC) ? AC : n); return i < 0 ? 99 : i; };

function status(n) {
  const played = [...new Set(n.events.filter(e => (e.Message === "Played " + AC || e.Message === "Played " + AC + "+")).map(e => e.Turn))];
  const held = [...new Set(n.events.filter(e => e.Kind === "hand").map(e => e.Turn))];
  if (played.length) return ["played", "played T" + played.join(", T")];
  if (held.length) return ["held", "drawn, not played"];
  if (!Object.keys(n.deck_before).some(c => c.startsWith(AC))) return ["none", n.gained.includes(AC) ? "picked here" : ""];
  return ["none", "not played"];
}

function deckLine(n) {
  const cards = Object.entries(n.deck_before).sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]))
    .map(([c, k]) => `<span class="${c.startsWith(AC) ? "ac" : ""}">${esc(c)}${k > 1 ? " ×" + k : ""}</span>`).join(", ");
  const added = n.gained.length ? ` → <span class="add">+${n.gained.map(esc).join(", +")}</span>` : "";
  return `<div class="deck">${cards}${added}</div>`;
}

const LABEL = { hand: "in hand", selected: "playing", after: "after", fight_rewards: "rewards", rewards: "offer", pick: "pick", skip: "skipped" };
function fig(e, enc) {
  const label = LABEL[e.Kind] || e.Kind;
  const turn = ["hand", "selected", "after"].includes(e.Kind) ? `T${e.Turn} ` : "";
  return `<figure><button type="button" data-src="${esc(e.Screenshot)}" data-cap="${esc(enc + " · " + turn + label)}"><img loading="lazy" src="${esc(e.Screenshot)}" alt="${esc(enc + ", " + turn + label)}"></button><figcaption class="${e.Kind}">${esc(turn + label)}</figcaption></figure>`;
}

document.getElementById("runline").textContent = `Defect · A${DATA.ascension} · seed ${DATA.seed} · died to Decimillipede on F29`;
document.getElementById("fights").innerHTML = DATA.nodes.filter(n => n.events.length).map(n => {
  const [cls, text] = status(n);
  const shots = n.events.filter(e => e.Screenshot && !["fight_rewards", "rewards"].includes(e.Kind));
  return `<section class="fight" id="f${n.floor}">
    <div class="head"><span class="floor">F${n.floor}</span><h2>${esc(n.encounter)}</h2><span class="status ${cls}">${text}</span></div>
    ${deckLine(n)}
    <div class="strip">${shots.map(e => fig(e, n.encounter)).join("")}</div>
  </section>`;
}).join("");

const dlg = document.getElementById("viewer");
const vImg = document.getElementById("viewer-img");
const SHOTS = [...document.querySelectorAll("figure button[data-src]")].map(b => b.dataset);
const cache = {};
let cur = 0;
function preload(i) { const s = SHOTS[i]; if (s && !cache[s.src]) { cache[s.src] = new Image(); cache[s.src].src = s.src; } }
function show(i) {
  cur = (i + SHOTS.length) % SHOTS.length;
  vImg.src = SHOTS[cur].src; vImg.alt = SHOTS[cur].cap;
  document.getElementById("viewer-cap").textContent = SHOTS[cur].cap;
  document.getElementById("v-count").textContent = `${cur + 1} / ${SHOTS.length}`;
  for (const d of [1, 2, 3, -1]) preload(cur + d);
}
function openAt(i) { show(i); if (!dlg.open) dlg.showModal(); }
document.addEventListener("click", ev => {
  const b = ev.target.closest("figure button[data-src]");
  if (b) openAt(SHOTS.findIndex(s => s.src === b.dataset.src));
});
document.getElementById("v-prev").addEventListener("click", () => show(cur - 1));
document.getElementById("v-next").addEventListener("click", () => show(cur + 1));
document.getElementById("v-stage").addEventListener("click", ev => { if (ev.target !== vImg) dlg.close(); });
document.addEventListener("keydown", ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  const k = ev.key;
  if (!dlg.open) { if (k === "ArrowRight" || k === "ArrowLeft") { ev.preventDefault(); openAt(k === "ArrowRight" ? cur : cur - 1); } return; }
  if (k === "ArrowRight" || k === "ArrowDown" || k === " ") { ev.preventDefault(); show(cur + 1); }
  else if (k === "ArrowLeft" || k === "ArrowUp") { ev.preventDefault(); show(cur - 1); }
  else if (k === "Home") { ev.preventDefault(); show(0); }
  else if (k === "End") { ev.preventDefault(); show(SHOTS.length - 1); }
});
function openFromHash() {
  const m = location.hash.match(/^#photos?(?:-(\d+))?$/);
  if (m) openAt(m[1] ? Math.min(Math.max(+m[1], 1), SHOTS.length) - 1 : 0);
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
let x0 = null;
dlg.addEventListener("touchstart", ev => { x0 = ev.touches[0].clientX; }, { passive: true });
dlg.addEventListener("touchend", ev => {
  if (x0 === null) return;
  const dx = ev.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
});
</script>
